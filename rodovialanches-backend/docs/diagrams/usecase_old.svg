<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 900 1040" font-family="Arial, sans-serif">
  <!-- Diagrama de Casos de Uso — Rodovia Lanches
       Gerente herda dos demais atores (UML generalization).
       Atores empilhados à esquerda, casos de uso no sistema (à direita).
       Inclui autenticação, ficha técnica/matérias-primas, delivery e cadastro de acessos. -->

  <style>
    .actor-line  { stroke: #1F3A60; stroke-width: 2; fill: none; stroke-linecap: round; }
    .actor-head  { fill: #fff; stroke: #1F3A60; stroke-width: 2; }
    .actor-name  { font-size: 14px; font-weight: bold; fill: #1F3A60; text-anchor: middle; }
    .uc          { fill: #E8F4FA; stroke: #2E5C8A; stroke-width: 1.5; }
    .uc-text     { font-size: 12px; fill: #1F3A60; text-anchor: middle; }
    .link        { stroke: #777; stroke-width: 1; }
    .gen         { stroke: #1F3A60; stroke-width: 1.8; fill: none; }
    .gen-tri     { fill: #fff; stroke: #1F3A60; stroke-width: 1.8; }
    .sys-box     { fill: none; stroke: #333; stroke-width: 2; }
    .sys-title   { font-size: 15px; font-style: italic; fill: #333; text-anchor: middle; }
    .title       { font-size: 20px; font-weight: bold; fill: #1F3A60; text-anchor: middle; }
    .note        { font-size: 11px; font-style: italic; fill: #555; text-anchor: middle; }
    .group-label { font-size: 11px; font-style: italic; fill: #999; text-anchor: start; }
  </style>

  <!-- Título -->
  <text x="450" y="35" class="title">Diagrama de Casos de Uso — Rodovia Lanches</text>
  <text x="450" y="55" class="note">Gerente herda das funções Garçom, Cozinha e Balcão (UML)</text>

  <!-- Caixa do sistema -->
  <rect x="300" y="90" width="380" height="895" rx="6" class="sys-box"/>
  <text x="490" y="115" class="sys-title">Sistema Rodovia Lanches</text>

  <!-- ========== ATORES À ESQUERDA ========== -->

  <!-- Garçom (centro em 300) -->
  <g id="garcom">
    <circle cx="100" cy="300" r="14" class="actor-head"/>
    <line x1="100" y1="314" x2="100" y2="346" class="actor-line"/>
    <line x1="78"  y1="330" x2="122" y2="330" class="actor-line"/>
    <line x1="100" y1="346" x2="80"  y2="378" class="actor-line"/>
    <line x1="100" y1="346" x2="120" y2="378" class="actor-line"/>
    <text x="100" y="405" class="actor-name">Garçom</text>
  </g>

  <!-- Cozinha (centro em 480) -->
  <g id="cozinha">
    <circle cx="100" cy="480" r="14" class="actor-head"/>
    <line x1="100" y1="494" x2="100" y2="526" class="actor-line"/>
    <line x1="78"  y1="510" x2="122" y2="510" class="actor-line"/>
    <line x1="100" y1="526" x2="80"  y2="558" class="actor-line"/>
    <line x1="100" y1="526" x2="120" y2="558" class="actor-line"/>
    <text x="100" y="585" class="actor-name">Cozinha</text>
  </g>

  <!-- Balcão (centro em 610) -->
  <g id="balcao">
    <circle cx="100" cy="610" r="14" class="actor-head"/>
    <line x1="100" y1="624" x2="100" y2="656" class="actor-line"/>
    <line x1="78"  y1="640" x2="122" y2="640" class="actor-line"/>
    <line x1="100" y1="656" x2="80"  y2="688" class="actor-line"/>
    <line x1="100" y1="656" x2="120" y2="688" class="actor-line"/>
    <text x="100" y="715" class="actor-name">Balcão</text>
  </g>

  <!-- Gerente (filho — herda dos três; centro em 790) -->
  <g id="gerente">
    <circle cx="100" cy="790" r="14" class="actor-head"/>
    <line x1="100" y1="804" x2="100" y2="836" class="actor-line"/>
    <line x1="78"  y1="820" x2="122" y2="820" class="actor-line"/>
    <line x1="100" y1="836" x2="80"  y2="868" class="actor-line"/>
    <line x1="100" y1="836" x2="120" y2="868" class="actor-line"/>
    <text x="100" y="895" class="actor-name">Gerente</text>
  </g>

  <!-- ========== HERANÇA (Gerente -|>): triângulo aberto aponta para o "pai" ========== -->
  <!-- Em UML a seta sai do filho (Gerente) e aponta para o pai (Garçom/Cozinha/Balcão).
       Como o Gerente herda dos três, três setas saem do Gerente. -->

  <!-- Gerente -> Garçom (seta longa, lateral esquerda) -->
  <path d="M 175 790 C 220 790, 220 370, 175 370" class="gen"/>
  <polygon points="178,362 162,370 178,378" class="gen-tri"/>

  <!-- Gerente -> Cozinha -->
  <path d="M 165 790 C 205 790, 205 530, 165 530" class="gen"/>
  <polygon points="168,522 152,530 168,538" class="gen-tri"/>

  <!-- Gerente -> Balcão -->
  <path d="M 155 790 C 185 790, 185 675, 155 675" class="gen"/>
  <polygon points="158,667 142,675 158,683" class="gen-tri"/>

  <!-- Legenda da herança -->
  <text x="230" y="790" class="note" text-anchor="start">▷ herda</text>

  <!-- ========== CASOS DE USO ========== -->

  <!-- Autenticação (comum a todos os perfis logados) -->
  <ellipse cx="490" cy="160" rx="120" ry="22" class="uc"/>
  <text x="490" y="165" class="uc-text">Autenticar com login e senha</text>

  <!-- Grupo Garçom (faixa 214 a 422) -->
  <ellipse cx="490" cy="235" rx="120" ry="22" class="uc"/>
  <text x="490" y="240" class="uc-text">Lançar Pedido (mesa ou delivery)</text>

  <ellipse cx="490" cy="290" rx="120" ry="22" class="uc"/>
  <text x="490" y="295" class="uc-text">Cadastrar Cliente</text>

  <ellipse cx="490" cy="345" rx="120" ry="22" class="uc"/>
  <text x="490" y="350" class="uc-text">Visualizar Pedidos Prontos</text>

  <ellipse cx="490" cy="400" rx="120" ry="22" class="uc"/>
  <text x="490" y="405" class="uc-text">Marcar Pedido Entregue</text>

  <!-- Grupo Cozinha (faixa 449 a 547) -->
  <ellipse cx="490" cy="470" rx="120" ry="22" class="uc"/>
  <text x="490" y="475" class="uc-text">Visualizar Pedidos</text>

  <ellipse cx="490" cy="525" rx="120" ry="22" class="uc"/>
  <text x="490" y="530" class="uc-text">Marcar como Pronto</text>

  <!-- Grupo Balcão (faixa 573 a 617) -->
  <ellipse cx="490" cy="595" rx="120" ry="22" class="uc"/>
  <text x="490" y="600" class="uc-text">Registrar Pagamento</text>

  <!-- Grupo Gerente exclusivos (faixa 643 a 962) -->
  <ellipse cx="490" cy="665" rx="120" ry="22" class="uc"/>
  <text x="490" y="670" class="uc-text">Gerenciar Matérias-Primas</text>

  <ellipse cx="490" cy="720" rx="120" ry="22" class="uc"/>
  <text x="490" y="725" class="uc-text">Gerenciar Fichas Técnicas</text>

  <ellipse cx="490" cy="775" rx="120" ry="22" class="uc"/>
  <text x="490" y="780" class="uc-text">Gerenciar Garçons</text>

  <ellipse cx="490" cy="830" rx="120" ry="22" class="uc"/>
  <text x="490" y="835" class="uc-text">Gerenciar Acessos</text>

  <ellipse cx="490" cy="885" rx="120" ry="22" class="uc"/>
  <text x="490" y="890" class="uc-text">Gerenciar Cardápio</text>

  <ellipse cx="490" cy="940" rx="120" ry="22" class="uc"/>
  <text x="490" y="945" class="uc-text">Ver Estatísticas e Pedidos</text>

  <!-- ========== LIGAÇÕES ATOR → UC ========== -->

  <!-- Todos os perfis logados -> Autenticar -->
  <line x1="120" y1="340" x2="370" y2="160" class="link"/>
  <line x1="120" y1="520" x2="370" y2="160" class="link"/>
  <line x1="120" y1="660" x2="370" y2="160" class="link"/>
  <line x1="120" y1="830" x2="370" y2="160" class="link"/>

  <!-- Garçom aos seus 4 UCs -->
  <line x1="120" y1="340" x2="370" y2="235" class="link"/>
  <line x1="120" y1="340" x2="370" y2="290" class="link"/>
  <line x1="120" y1="340" x2="370" y2="345" class="link"/>
  <line x1="120" y1="340" x2="370" y2="400" class="link"/>

  <!-- Cozinha aos seus 2 UCs -->
  <line x1="120" y1="520" x2="370" y2="470" class="link"/>
  <line x1="120" y1="520" x2="370" y2="525" class="link"/>

  <!-- Balcão: visualiza prontos (para pagar) e registra pagamento -->
  <line x1="120" y1="660" x2="370" y2="345" class="link"/>
  <line x1="120" y1="660" x2="370" y2="595" class="link"/>

  <!-- Gerente aos seus 6 UCs EXCLUSIVOS
       (o Gerente também ACESSA os outros, mas via herança — não precisamos desenhar) -->
  <line x1="120" y1="830" x2="370" y2="665" class="link"/>
  <line x1="120" y1="830" x2="370" y2="720" class="link"/>
  <line x1="120" y1="830" x2="370" y2="775" class="link"/>
  <line x1="120" y1="830" x2="370" y2="830" class="link"/>
  <line x1="120" y1="830" x2="370" y2="885" class="link"/>
  <line x1="120" y1="830" x2="370" y2="940" class="link"/>

</svg>
