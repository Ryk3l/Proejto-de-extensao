<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="720" viewBox="0 0 1020 720" font-family="Arial, sans-serif">
  <!-- Diagrama de Classes — Rodovia Lanches
       Layout em duas colunas:
         Esquerda: Usuario + 4 subclasses (Garcom, Cozinha, Balcao, Gerente)
         Direita:  Pedido -> ItemPedido -> Produto (encadeamento)
       As subclasses mostram o valor do campo "papel" que as distingue. -->

  <style>
    .class-rect  { fill: #fff; stroke: #1F3A60; stroke-width: 1.8; }
    .class-sep   { stroke: #1F3A60; stroke-width: 1.8; fill: none; }
    .class-name  { font-size: 16px; font-weight: bold; fill: #1F3A60; text-anchor: middle; }
    .attr        { font-size: 13px; fill: #1F3A60; text-anchor: start; }
    .sub-name    { font-size: 14px; font-weight: bold; fill: #1F3A60; text-anchor: middle; }
    .sub-papel   { font-size: 11px; font-family: Consolas, monospace; fill: #2E5C8A; text-anchor: middle; }
    .rel-line    { stroke: #1F3A60; stroke-width: 1.5; fill: none; }
    .gen-line    { stroke: #1F3A60; stroke-width: 1.8; fill: none; }
    .gen-tri     { fill: #fff; stroke: #1F3A60; stroke-width: 1.8; }
    .rel-label   { font-size: 12px; fill: #555; text-anchor: middle; }
    .cardinality { font-size: 12px; fill: #555; font-weight: bold; }
    .title       { font-size: 20px; font-weight: bold; fill: #1F3A60; text-anchor: middle; }
  </style>

  <!-- Título -->
  <text x="510" y="35" class="title">Diagrama de Classes — Rodovia Lanches</text>

  <!-- ========== CLASSE Usuario ========== -->
  <rect x="50" y="80" width="440" height="180" class="class-rect"/>
  <line x1="50" y1="110" x2="490" y2="110" class="class-sep"/>
  <line x1="50" y1="230" x2="490" y2="230" class="class-sep"/>
  <text x="270" y="100" class="class-name">Usuario</text>
  <text x="60" y="135" class="attr">+ id : Long</text>
  <text x="60" y="160" class="attr">+ nome : String</text>
  <text x="60" y="185" class="attr">+ papel : String</text>
  <text x="60" y="210" class="attr">+ telefone : String</text>

  <!-- Subclasses Garcom/Cozinha/Balcao/Gerente foram removidas.
       A diferenciação entre os papéis fica implícita no campo "papel" da classe Usuario. -->

  <!-- ========== CLASSE Pedido ========== -->
  <!-- Pedido foi movido para x=620 (gap de 130px do Usuario) para
       o label "registrado_por" caber confortavelmente. -->
  <rect x="620" y="80" width="380" height="180" class="class-rect"/>
  <line x1="620" y1="110" x2="1000" y2="110" class="class-sep"/>
  <line x1="620" y1="230" x2="1000" y2="230" class="class-sep"/>
  <text x="810" y="100" class="class-name">Pedido</text>
  <text x="630" y="135" class="attr">+ id : Long</text>
  <text x="630" y="160" class="attr">+ garcom : Usuario</text>
  <text x="630" y="185" class="attr">+ numeroMesa : Integer</text>
  <text x="630" y="210" class="attr">+ criadoEm : LocalDateTime</text>

  <!-- ========== CLASSE ItemPedido ========== -->
  <rect x="620" y="340" width="380" height="130" class="class-rect"/>
  <line x1="620" y1="370" x2="1000" y2="370" class="class-sep"/>
  <line x1="620" y1="440" x2="1000" y2="440" class="class-sep"/>
  <text x="810" y="360" class="class-name">ItemPedido</text>
  <text x="630" y="395" class="attr">+ id : Long</text>
  <text x="630" y="420" class="attr">+ produto : Produto</text>
  <text x="630" y="437" class="attr">+ quantidade : Integer</text>

  <!-- ========== CLASSE Produto ========== -->
  <rect x="620" y="520" width="380" height="160" class="class-rect"/>
  <line x1="620" y1="550" x2="1000" y2="550" class="class-sep"/>
  <line x1="620" y1="650" x2="1000" y2="650" class="class-sep"/>
  <text x="810" y="540" class="class-name">Produto</text>
  <text x="630" y="575" class="attr">+ id : Long</text>
  <text x="630" y="598" class="attr">+ nome : String</text>
  <text x="630" y="621" class="attr">+ preco : Double</text>
  <text x="630" y="644" class="attr">+ quantidade : Integer</text>

  <!-- ========== RELACIONAMENTOS ========== -->

  <!-- Pedido -> Usuario (Pedido tem 1 Garcom, registrado_por) -->
  <!-- Linha agora com 130px de espaço: vai de x=490 (Usuario) a x=620 (Pedido). -->
  <line x1="490" y1="160" x2="620" y2="160" class="rel-line"/>
  <text x="555" y="152" class="rel-label">registrado_por</text>
  <text x="497" y="174" class="cardinality">1</text>
  <text x="607" y="174" class="cardinality">*</text>

  <!-- Pedido -> ItemPedido (1 Pedido contém * ItemPedido) -->
  <line x1="810" y1="260" x2="810" y2="340" class="rel-line"/>
  <text x="820" y="305" class="rel-label" text-anchor="start">contém</text>
  <text x="795" y="275" class="cardinality">1</text>
  <text x="795" y="338" class="cardinality">*</text>

  <!-- ItemPedido -> Produto (* ItemPedido referencia 1 Produto) -->
  <line x1="810" y1="470" x2="810" y2="520" class="rel-line"/>
  <text x="820" y="497" class="rel-label" text-anchor="start">referencia</text>
  <text x="795" y="485" class="cardinality">*</text>
  <text x="795" y="518" class="cardinality">1</text>

</svg>
